<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Automático Seguro</title>

<style>
body{
  font-family:Arial;
  background:#010101;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

h1{
  color:#00f2ea;
  text-shadow:2px 2px 4px #ff0050;
}

#chat-box{
  width:100%;
  max-width:420px;
  height:450px;
  background:#121212;
  border-radius:12px;
  padding:15px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  border:2px solid #ff0050;
}

.msg{
  padding:10px 15px;
  border-radius:20px;
  max-width:75%;
  word-wrap:break-word;
}

.usuario{
  background:#00f2ea;
  color:#010101;
  align-self:flex-end;
}

.bot{
  background:#ff0050;
  color:#fff;
  align-self:flex-start;
}

/* DIGITANDO */
.typing{
  background:#ff0050;
  padding:10px 15px;
  border-radius:20px;
  display:flex;
  gap:6px;
  align-self:flex-start;
}

.typing span{
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
  animation:blink 1.4s infinite;
}

.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}

@keyframes blink{
  0%{opacity:.2}
  20%{opacity:1}
  100%{opacity:.2}
}

input,button{
  width:100%;
  padding:12px;
  border-radius:20px;
  border:none;
  margin-top:10px;
}

button{
  background:#00f2ea;
  font-weight:bold;
  cursor:pointer;
}

.opcoes{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.opcao-btn{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#00f2ea;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Chat 🤖</h1>

<div id="chat-box"></div>
<input id="msg" placeholder="Digite sua mensagem...">
<button onclick="enviarMensagem()">Enviar</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey:"AIzaSyDcZxOE2lP45yk0IxEpRWX06UN4-NrSGes",
  authDomain:"chat-anonimo-beab4.firebaseapp.com",
  databaseURL:"https://chat-anonimo-beab4-default-rtdb.firebaseio.com/",
  projectId:"chat-anonimo-beab4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let sala = "chat_final_pix";
let userId = Date.now().toString();

/* ================= DIGITANDO ================= */
function mostrarDigitando(){
  if(document.getElementById("typing")) return;
  const chat = document.getElementById("chat-box");
  const d = document.createElement("div");
  d.className = "typing";
  d.id = "typing";
  d.innerHTML = "<span></span><span></span><span></span>";
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function removerDigitando(){
  const d = document.getElementById("typing");
  if(d) d.remove();
}

/* ================= BOT ================= */
function responderBot(texto){
  mostrarDigitando();
  setTimeout(()=>{
    removerDigitando();
    push(ref(db,"mensagens/"+sala),{
      texto,
      tipo:"bot"
    });
  },900);
}

/* ================= OPÇÕES ================= */
function mostrarOpcoes(){
  const chat = document.getElementById("chat-box");
  const div = document.createElement("div");
  div.className = "opcoes";

  ["Publicar no site","Dúvida","Reclamação","PIX"].forEach(op=>{
    const b = document.createElement("button");
    b.className = "opcao-btn";
    b.textContent = op;
    b.onclick = ()=>escolherOpcao(op);
    div.appendChild(b);
  });

  chat.appendChild(div);
}

/* ================= ESCOLHA ================= */
function escolherOpcao(op){
  push(ref(db,"mensagens/"+sala),{
    texto: op,
    tipo:"usuario"
  });

  if(op==="Publicar no site"){
    responderBot("Para publicar no site, envie o conteúdo (vídeo ou material) pelo WhatsApp informado no site 📲");
  }

  if(op==="Dúvida"){
    responderBot("Pode digitar sua dúvida, estou aqui para ajudar 😊");
  }

  if(op==="Reclamação"){
    responderBot("Descreva o problema com detalhes, vamos analisar 👇");
  }

  if(op==="PIX"){
    responderBot("Nosso PIX é: gustavopaulo2283@gmail.com");
  }
}

/* ================= INTELIGÊNCIA ================= */
function respostaAutomatica(texto){
  texto = texto.toLowerCase();

  /* PUBLICAÇÃO */
  if(texto.includes("publicar") || texto.includes("postar") || texto.includes("enviar video") || texto.includes("colocar no site")){
    return "Para publicar no site, envie o conteúdo (vídeo ou material) pelo WhatsApp disponível no site 📲";
  }

  /* SEGURANÇA */
  if(texto.includes("seguro") || texto.includes("segurança") || texto.includes("confiável") || texto.includes("golpe") || texto.includes("virus")){
    return "Sim ✅ o site é seguro, usamos conexão protegida e não solicitamos dados sensíveis.";
  }

  /* PAGAMENTO */
  if(texto.includes("pix") || texto.includes("pagamento") || texto.includes("pagar")){
    return "Aceitamos PIX com total segurança. Nenhum dado bancário é armazenado.";
  }

  /* CONTATO */
  if(texto.includes("whatsapp") || texto.includes("contato") || texto.includes("falar com alguém")){
    return "Você pode falar conosco pelo WhatsApp disponível no site 📲";
  }

  /* FUNCIONAMENTO */
  if(texto.includes("como funciona") || texto.includes("funciona")){
    return "Você escolhe uma opção no chat ou digita sua pergunta que respondemos automaticamente 😊";
  }

  /* HORÁRIO */
  if(texto.includes("horário") || texto.includes("atendimento")){
    return "Nosso atendimento é online e respondemos o mais rápido possível ⏰";
  }

  /* AGRADECIMENTO */
  if(texto.includes("obrigado") || texto.includes("valeu") || texto.includes("agradeço")){
    return "Nós que agradecemos 🙌";
  }

  /* SAUDAÇÃO */
  if(texto.includes("oi") || texto.includes("olá") || texto.includes("bom dia") || texto.includes("boa tarde")){
    return "Olá 😄 Como posso te ajudar hoje?";
  }

  /* PADRÃO */
  return "Mensagem recebida ✅ Se puder, explique um pouco mais para eu te ajudar melhor 😉";
}

/* ================= ENVIAR ================= */
window.enviarMensagem = function(){
  const input = document.getElementById("msg");
  const texto = input.value.trim();
  if(!texto) return;

  push(ref(db,"mensagens/"+sala),{
    texto,
    tipo:"usuario"
  });

  input.value = "";

  responderBot(respostaAutomatica(texto));
}

/* ================= CARREGAR ================= */
function carregar(){
  const chat = document.getElementById("chat-box");
  onValue(ref(db,"mensagens/"+sala),snap=>{
    chat.innerHTML="";
    snap.forEach(c=>{
      const m = c.val();
      const d = document.createElement("div");
      d.className = "msg "+m.tipo;
      d.textContent = m.texto;
      chat.appendChild(d);
    });
    chat.scrollTop = chat.scrollHeight;
  });
}

/* ================= INÍCIO ================= */
async function iniciar(){
  await remove(ref(db,"mensagens/"+sala));
  push(ref(db,"mensagens/"+sala),{
    texto:"Olá 😄 Posso te ajudar com publicações, dúvidas, segurança, pagamentos e muito mais.",
    tipo:"bot"
  });
  setTimeout(mostrarOpcoes,400);
}

carregar();
iniciar();
</script>


</body>
</html>
